name: Build Combined IPA (spoti.pw + EeveeSpotify)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string
      spoti.pw_branch:
        description: "spoti.pw branch to build from"
        default: "master"
        required: true
        type: string
      ipa_url:
        description: "URL to a decrypted Spotify IPA (required for combined build)"
        default: ""
        required: true
        type: string
      upload_method:
        description: "Where to upload the built IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"
  SPOTIPW_REPO: "spoti.pw"  # spoti.pw repo name (skopevoj/spoti.pw)

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      # ─── Checkout EeveeSpotify (main repo) ────────────────────────────────
      - name: Checkout EeveeSpotify
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      # ─── Checkout spoti.pw as subdirectory ────────────────────────────────
      - name: Checkout spoti.pw
        uses: actions/checkout@v4
        with:
          repository: skopevoj/${{ env.SPOTIPW_REPO }}
          ref: ${{ inputs.spoti.pw_branch }}
          path: spoti.pw
          submodules: recursive

      # ─── Setup Xcode & Theos ──────────────────────────────────────────────
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      # ─── Install build tools ──────────────────────────────────────────────
      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      # ─── Build spoti.pw (Liquid Glass) ───────────────────────────────────
      - name: Build spoti.pw
        run: |
          cd spoti.pw/tweak
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      # ─── Build EeveeSwiftProtobuf framework ──────────────────────────────
      - name: Build EeveeSwiftProtobuf.framework
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      # ─── Build EeveeSpotify ──────────────────────────────────────────────
      - name: Build EeveeSpotify
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      # ─── Build zxPluginsInject ───────────────────────────────────────────
      - name: Build zxPluginsInject.dylib
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      # ─── Download vanilla IPA ────────────────────────────────────────────
      - uses: levibostian/action-hide-sensitive-inputs@v1

      - name: Download vanilla Spotify IPA
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      # ─── Extract both .debs ──────────────────────────────────────────────
      - name: Extract both .debs
        run: |
          EXTRACT_DIR="${{ github.workspace }}/Outputs/combined-extract"
          rm -rf "$EXTRACT_DIR"; mkdir -p "$EXTRACT_DIR"

          # spoti.pw deb
          SPOTIPW_DEB=$(find spoti.pw/tweak/packages -name "com.spotipw_"*.deb | head -1)
          [ -n "$SPOTIPW_DEB" ] || { echo "spoti.pw deb not produced" >&2; exit 1; }
          dpkg-deb -R "$SPOTIPW_DEB" "$EXTRACT_DIR/spotipw"

          # EeveeSpotify deb
          EEVEE_DEB=$(find packages -name "com.eevee.spotify_"*.deb | head -1)
          [ -n "$EEVEE_DEB" ] || { echo "EeveeSpotify deb not produced" >&2; exit 1; }
          dpkg-deb -R "$EEVEE_DEB" "$EXTRACT_DIR/eevee"

          SPOTIPW_DYLIB=$(find "$EXTRACT_DIR/spotipw" -name 'spotifyglass.dylib' | head -1)
          EEVEE_DYLIB=$(find "$EXTRACT_DIR/eevee" -name 'EeveeSpotify.dylib' | head -1)
          EEVEE_BUNDLE=$(find "$EXTRACT_DIR/eevee" -type d -name 'EeveeSpotify.bundle' | head -1)
          EEVEE_FW=$(find "$EXTRACT_DIR/eevee" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)

          [ -n "$SPOTIPW_DYLIB" ] || { echo "spotifyglass.dylib not found" >&2; exit 1; }
          [ -n "$EEVEE_DYLIB" ]   || { echo "EeveeSpotify.dylib not found" >&2; exit 1; }

          echo "SPOTIPW_DYLIB=$SPOTIPW_DYLIB" >> $GITHUB_ENV
          echo "EEVEE_DYLIB=$EEVEE_DYLIB" >> $GITHUB_ENV
          echo "EEVEE_BUNDLE=$EEVEE_BUNDLE" >> $GITHUB_ENV
          echo "EEVEE_FW=$EEVEE_FW" >> $GITHUB_ENV
          echo "SPOTIPW_DEB=$SPOTIPW_DEB" >> $GITHUB_ENV
          echo "EEVEE_DEB=$EEVEE_DEB" >> $GITHUB_ENV

      # ─── cyan inject both dylibs + framework + bundle ────────────────────
      - name: cyan inject (combined)
        run: |
          mkdir -p Outputs/IPAS
          SPOTIPW_VER=$(cat spoti.pw/version.txt 2>/dev/null || echo "0.51.0")
          EEVEE_VER=$(grep -E '^Version:' control | awk '{print $2}')
          SPOT_VER=$(unzip -p ${{ github.workspace }}/spotify.ipa 'Payload/Spotify.app/Info.plist' \
              | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          OUT="Outputs/IPAS/Spotify-Combined-Eevee${EEVEE_VER}-SpotiPw${SPOTIPW_VER}-${SPOT_VER}.ipa"

          INJECT=("$SPOTIPW_DYLIB" "$EEVEE_DYLIB")
          [ -n "$EEVEE_FW" ]    && INJECT+=("$EEVEE_FW")
          [ -n "$EEVEE_BUNDLE" ] && INJECT+=("$EEVEE_BUNDLE")

          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du

          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      # ─── LC-inject zxPluginsInject (ipapatch) ────────────────────────────
      - name: LC-inject zxPluginsInject (ipapatch)
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      # ─── Fetch & inject OpeninSafariSpotify extension ────────────────────
      - name: Fetch OpeninSafariSpotify extension
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject OpeninSafariSpotify extension into IPA PlugIns
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      # ─── Strip Watch app ─────────────────────────────────────────────────
      - name: Strip Watch app (if any)
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      # ─── Stage alternate app icons ───────────────────────────────────────
      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      # ─── Upload .deb artifacts ───────────────────────────────────────────
      - name: Upload spoti.pw .deb
        uses: actions/upload-artifact@v4
        with:
          name: spoti.pw-deb
          path: ${{ env.SPOTIPW_DEB }}
          if-no-files-found: error

      - name: Upload EeveeSpotify .deb
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-deb
          path: ${{ env.EEVEE_DEB }}
          if-no-files-found: error

      # ─── Upload combined IPA ─────────────────────────────────────────────
      - name: Upload Combined IPA artifact
        if: inputs.upload_method == 'artifacts' || inputs.upload_method == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-Combined-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload Combined IPA to filebin.net
        if: inputs.upload_method == 'filebin' || inputs.upload_method == 'both'
        run: |
          BIN="eevee-spotipw-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST \
               -H "Content-Type: application/octet-stream" \
               --data-binary "@${OUT_IPA}" \
               "https://filebin.net/${BIN}/${FILENAME}" >/dev/null
          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### 📦 filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"