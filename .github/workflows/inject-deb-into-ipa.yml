name: Inject EeveeSpotify .deb into Pre-built IPA

on:
  workflow_dispatch:
    inputs:
      ipa_source:
        description: "Source of the base IPA"
        required: true
        type: choice
        options:
          - url
          - artifact
      ipa_url:
        description: "URL to the pre-built IPA (if ipa_source=url)"
        required: false
        type: string
        default: ""
      artifact_name:
        description: "Artifact name containing the IPA (if ipa_source=artifact)"
        required: false
        type: string
        default: "prebuilt-ipa"
      branch:
        description: "Branch to build EeveeSpotify from"
        default: "Master"
        required: true
        type: choice
        options:
          - Master
      eevee_version:
        description: "EeveeSpotify version override (optional, auto-read from control)"
        required: false
        type: string
        default: ""
      upload_method:
        description: "Where to upload the final IPA"
        default: "artifacts"
        required: true
        type: choice
        options:
          - artifacts
          - filebin
          - both

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  inject:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout EeveeSpotify
        uses: actions/checkout@v4
        with:
          repository: t3s-co/EeveeSpotifyReincarnated
          ref: ${{ inputs.branch }}
          fetch-depth: 1
          submodules: recursive

      - name: Download base IPA from URL
        if: inputs.ipa_source == 'url'
        run: |
          [ -n "${{ inputs.ipa_url }}" ] || { echo "ipa_url required when ipa_source=url"; exit 1; }
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/base.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/base.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Download base IPA from artifact
        if: inputs.ipa_source == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ github.workspace }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Locate base IPA
        run: |
          BASE_IPA=$(find ${{ github.workspace }} -maxdepth 1 -name "*.ipa" | head -1)
          [ -n "$BASE_IPA" ] && [ -f "$BASE_IPA" ] || { echo "No IPA found in workspace"; exit 1; }
          echo "BASE_IPA=$BASE_IPA" >> $GITHUB_ENV
          echo "Using base IPA: $BASE_IPA"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
          ipapatch --help >/dev/null

      - name: Build EeveeSwiftProtobuf.framework
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

      - name: Build EeveeSpotify
        run: |
          THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Build zxPluginsInject
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: Extract EeveeSpotify .deb
        run: |
          EEVEE_DEB=$(find packages -name "com.eevee.spotify_"*.deb | head -1)
          [ -n "$EEVEE_DEB" ] || { echo "EeveeSpotify deb not produced" >&2; exit 1; }
          EXTRACT_DIR="${{ github.workspace }}/eevee-extract"
          rm -rf "$EXTRACT_DIR"; mkdir -p "$EXTRACT_DIR"
          dpkg-deb -R "$EEVEE_DEB" "$EXTRACT_DIR"
          EEVEE_DYLIB=$(find "$EXTRACT_DIR" -name 'EeveeSpotify.dylib' | head -1)
          EEVEE_BUNDLE=$(find "$EXTRACT_DIR" -type d -name 'EeveeSpotify.bundle' | head -1)
          EEVEE_FW=$(find "$EXTRACT_DIR" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)
          [ -n "$EEVEE_DYLIB" ] || { echo "EeveeSpotify.dylib not found" >&2; exit 1; }
          [ -n "$EEVEE_FW" ] || { echo "EeveeSwiftProtobuf.framework not found" >&2; exit 1; }
          echo "EEVEE_DYLIB=$EEVEE_DYLIB" >> $GITHUB_ENV
          echo "EEVEE_BUNDLE=$EEVEE_BUNDLE" >> $GITHUB_ENV
          echo "EEVEE_FW=$EEVEE_FW" >> $GITHUB_ENV
          echo "EEVEE_DEB=$EEVEE_DEB" >> $GITHUB_ENV

      - name: Import signing certificate
        if: env.SIGNING_CERT_P12_BASE64 != ''
        run: |
          echo "${{ secrets.SIGNING_CERT_P12_BASE64 }}" | base64 -d > cert.p12
          security create-keychain -p "ci-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "ci-keychain" build.keychain
          security import cert.p12 -k build.keychain -P "${{ secrets.SIGNING_CERT_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "ci-keychain" build.keychain
          rm cert.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep -E '^[[:space:]]*[0-9]+\) [0-9A-F]{40}' | head -1 | sed -E 's/.*\) ([0-9A-F]{40}).*/\1/')
          [ -n "$IDENTITY" ] || { echo "No signing identity found in keychain"; exit 1; }
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Using signing identity: $IDENTITY"

      - name: Import provisioning profile (optional)
        if: env.PROVISIONING_PROFILE_BASE64 != ''
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          PROFILE_UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          echo "PROVISIONING_UUID=$PROFILE_UUID" >> $GITHUB_ENV
          rm profile.mobileprovision

      - name: Create entitlements.plist
        run: |
          cat > entitlements.plist <<'ENDOFPFILE'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>get-task-allow</key><true/>
              <key>application-identifier</key><string>${{ secrets.SIGNING_TEAM_ID }}.com.spotify.client</string>
              <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
              <key>com.apple.security.cs.allow-jit</key><true/>
              <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
              <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          ENDOFPFILE
          echo "Created entitlements.plist"

      - name: Inject EeveeSpotify dylib + framework + bundle
        run: |
          EEVEE_VER="${{ inputs.eevee_version }}"
          [ -n "$EEVEE_VER" ] || EEVEE_VER=$(grep -E '^Version:' control | awk '{print $2}')
          SPOT_VER=$(unzip -p "$BASE_IPA" 'Payload/Spotify.app/Info.plist' | plutil -extract CFBundleShortVersionString raw - 2>/dev/null || echo "unknown")
          OUT_DIR="${{ github.workspace }}/Outputs/IPAS"
          mkdir -p "$OUT_DIR"
          OUT_IPA="$OUT_DIR/Spotify-EeveeInjected-${EEVEE_VER}-${SPOT_VER}.ipa"
          INJECT=("$EEVEE_DYLIB" "$EEVEE_FW")
          [ -n "$EEVEE_BUNDLE" ] && INJECT+=("$EEVEE_BUNDLE")
          cyan -i "$BASE_IPA" -o "$OUT_IPA" -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT_IPA" >> $GITHUB_ENV

      - name: LC-inject zxPluginsInject
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm --dylib packages/zxPluginsInject.dylib

      - name: Re-sign IPA
        if: env.SIGNING_IDENTITY != ''
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          find Payload/Spotify.app -name "*.dylib" -o -name "*.framework" | while read f; do
            codesign -f -s "$SIGNING_IDENTITY" --entitlements ${{ github.workspace }}/entitlements.plist "$f"
          done
          codesign -f -s "$SIGNING_IDENTITY" --entitlements ${{ github.workspace }}/entitlements.plist Payload/Spotify.app
          rm -f "$OUT_IPA"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload
          echo "Re-signed: $OUT_IPA"

      - name: Strip Watch app
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          rm -rf Payload/Spotify.app/Watch Payload/Spotify.app/com.apple.WatchPlaceholder 2>/dev/null || true
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload EeveeSpotify .deb
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-deb
          path: ${{ env.EEVEE_DEB }}
          if-no-files-found: error

      - name: Upload Final IPA artifact
        if: inputs.upload_method == 'artifacts' || inputs.upload_method == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-EeveeInjected-IPA
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error

      - name: Upload Final IPA to filebin.net
        if: inputs.upload_method == 'filebin' || inputs.upload_method == 'both'
        run: |
          BIN="eevee-injected-${{ github.run_id }}-${{ github.run_attempt }}"
          FILENAME=$(basename "$OUT_IPA")
          curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@${OUT_IPA}" "https://filebin.net/${BIN}/${FILENAME}" >/dev/null
          DOWNLOAD_URL="https://filebin.net/${BIN}/${FILENAME}"
          echo "Uploaded to: ${DOWNLOAD_URL}"
          {
            echo "### filebin.net download"
            echo "- **File:** ${FILENAME}"
            echo "- **URL:** ${DOWNLOAD_URL}"
            echo "- _Filebin auto-deletes bins after a period of inactivity — download promptly._"
          } >> "$GITHUB_STEP_SUMMARY"